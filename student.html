<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Bee - Student</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .join-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
            font-size: 1.1em;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1.1em;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .game-area {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .waiting-message {
            text-align: center;
            padding: 60px 20px;
        }
        
        .waiting-message h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .waiting-message p {
            color: #666;
            font-size: 1.2em;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        
        .sentence-container {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        
        .sentence {
            font-size: 1.5em;
            line-height: 1.8;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        .sentence .correct {
            color: #28a745;
            background: #d4edda;
        }
        
        .sentence .incorrect {
            color: #dc3545;
            background: #f8d7da;
        }
        
        .sentence .current {
            background: #fff3cd;
            border-bottom: 3px solid #667eea;
        }
        
        .typing-area {
            margin-bottom: 20px;
        }
        
        #typingInput {
            width: 100%;
            padding: 20px;
            border: 3px solid #667eea;
            border-radius: 10px;
            font-size: 1.3em;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        #typingInput:disabled {
            background: #e9ecef;
            cursor: not-allowed;
        }
        
        .results-screen {
            text-align: center;
            padding: 40px;
        }
        
        .results-screen h2 {
            color: #28a745;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
        }
        
        .result-value {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .result-label {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #dc3545;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .stats-bar {
                grid-template-columns: 1fr;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .sentence {
                font-size: 1.2em;
            }
            
            #typingInput {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⌨️ Typing Bee</h1>
        </div>
        
        <!-- Join View -->
        <div id="joinView" class="join-form">
            <div class="form-group">
                <label for="playerName">Your Name</label>
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
            </div>
            <div class="form-group">
                <label for="gameCode">Game Code</label>
                <input type="text" id="gameCode" placeholder="Enter 6-digit code" maxlength="6" style="text-transform: uppercase;">
            </div>
            <div id="errorMessage" class="error-message hidden"></div>
            <button onclick="joinGame()">Join Game</button>
        </div>
        
        <!-- Waiting View -->
        <div id="waitingView" class="game-area hidden">
            <div class="waiting-message pulse">
                <h2>✓ You're In!</h2>
                <p>Waiting for teacher to start the race...</p>
            </div>
        </div>
        
        <!-- Game View -->
        <div id="gameView" class="game-area hidden">
            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-value" id="wpmDisplay">0</div>
                    <div class="stat-label">WPM</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="accuracyDisplay">100</div>
                    <div class="stat-label">Accuracy %</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="progressDisplay">0</div>
                    <div class="stat-label">Progress %</div>
                </div>
            </div>
            
            <div class="sentence-container">
                <div class="sentence" id="sentenceDisplay"></div>
            </div>
            
            <div class="typing-area">
                <input 
                    type="text" 
                    id="typingInput" 
                    placeholder="Type here when the race starts..."
                    disabled
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
            </div>
        </div>
        
        <!-- Results View -->
        <div id="resultsView" class="game-area hidden">
            <div class="results-screen">
                <h2>🏆 Race Complete!</h2>
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-value" id="finalWpm">0</div>
                        <div class="result-label">Words Per Minute</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="finalAccuracy">0</div>
                        <div class="result-label">Accuracy %</div>
                    </div>
                </div>
                <p style="color: #666; font-size: 1.2em;">Check the teacher's screen for final rankings!</p>
            </div>
        </div>
    </div>
    
    <script>
        let ws;
        let playerId = null;
        let currentGameCode = null;
        let sentence = '';
        let startTime = null;
        let currentPosition = 0;
        let correctChars = 0;
        let totalChars = 0;
        let gameStarted = false;
        
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.hostname || 'localhost';
            const wsUrl = `${wsProtocol}//${wsHost}:8001`;
            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('Connected to server');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('Disconnected from server');
                setTimeout(connectWebSocket, 2000);
            };
        }
        
        function handleServerMessage(data) {
            if (data.type === 'joined') {
                playerId = data.player_id;
                currentGameCode = document.getElementById('gameCode').value.toUpperCase();
                sentence = data.game_state.sentence;
                
                document.getElementById('joinView').classList.add('hidden');
                document.getElementById('waitingView').classList.remove('hidden');
            } else if (data.type === 'error') {
                showError(data.message);
            } else if (data.type === 'game_state') {
                if (data.game_state.started && !gameStarted) {
                    startRace(data.game_state.sentence);
                }
            }
        }
        
        function joinGame() {
            const playerName = document.getElementById('playerName').value.trim();
            const gameCode = document.getElementById('gameCode').value.trim().toUpperCase();
            
            if (!playerName) {
                showError('Please enter your name');
                return;
            }
            
            if (!gameCode || gameCode.length !== 6) {
                showError('Please enter a valid 6-digit game code');
                return;
            }
            
            ws.send(JSON.stringify({
                action: 'join_game',
                game_code: gameCode,
                player_name: playerName
            }));
        }
        
        function startRace(sentenceText) {
            gameStarted = true;
            sentence = sentenceText;
            startTime = Date.now();
            
            document.getElementById('waitingView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            
            renderSentence();
            
            const input = document.getElementById('typingInput');
            input.disabled = false;
            input.focus();
            input.addEventListener('input', handleTyping);
        }
        
        function renderSentence() {
            const sentenceDiv = document.getElementById('sentenceDisplay');
            const input = document.getElementById('typingInput').value;
            
            let html = '';
            for (let i = 0; i < sentence.length; i++) {
                let className = '';
                if (i < input.length) {
                    className = input[i] === sentence[i] ? 'correct' : 'incorrect';
                } else if (i === input.length) {
                    className = 'current';
                }
                html += `<span class="${className}">${sentence[i]}</span>`;
            }
            
            sentenceDiv.innerHTML = html;
        }
        
        function handleTyping(e) {
            const input = e.target.value;
            currentPosition = input.length;
            
            renderSentence();
            calculateStats();
            
            // Check if completed
            if (input === sentence) {
                completeRace();
            } else {
                // Send progress update
                sendProgressUpdate(false);
            }
        }
        
        function calculateStats() {
            const input = document.getElementById('typingInput').value;
            
            // Calculate WPM
            const timeElapsed = (Date.now() - startTime) / 1000 / 60; // in minutes
            const wordsTyped = input.length / 5; // standard: 5 chars = 1 word
            const wpm = timeElapsed > 0 ? Math.round(wordsTyped / timeElapsed) : 0;
            
            // Calculate accuracy
            let correct = 0;
            for (let i = 0; i < input.length; i++) {
                if (input[i] === sentence[i]) {
                    correct++;
                }
            }
            const accuracy = input.length > 0 ? Math.round((correct / input.length) * 100) : 100;
            
            // Calculate progress
            const progress = Math.round((input.length / sentence.length) * 100);
            
            // Update display
            document.getElementById('wpmDisplay').textContent = wpm;
            document.getElementById('accuracyDisplay').textContent = accuracy;
            document.getElementById('progressDisplay').textContent = progress;
            
            return { wpm, accuracy, progress };
        }
        
        function sendProgressUpdate(completed) {
            const stats = calculateStats();
            
            ws.send(JSON.stringify({
                action: 'update_progress',
                game_code: currentGameCode,
                player_id: playerId,
                progress: stats.progress,
                wpm: stats.wpm,
                accuracy: stats.accuracy,
                completed: completed
            }));
        }
        
        function completeRace() {
            const input = document.getElementById('typingInput');
            input.disabled = true;
            
            const stats = calculateStats();
            
            // Send completion update
            sendProgressUpdate(true);
            
            // Show results
            document.getElementById('finalWpm').textContent = stats.wpm;
            document.getElementById('finalAccuracy').textContent = stats.accuracy + '%';
            
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('resultsView').classList.remove('hidden');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 3000);
        }
        
        // Allow Enter key to join
        document.getElementById('gameCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinGame();
        });
        
        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinGame();
        });
        
        // Connect on page load
        connectWebSocket();
    </script>
</body>
</html>
